name: nishit_vadgama
description: "Service Management Application - Flutter Frontend Assessment"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State management & navigation
  get: ^4.7.3

  # UI & Icons
  iconsax_flutter: ^1.0.1
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.4
  loading_animation_widget: ^1.3.0
  skeletonizer: ^3.0.0
  flutter_animate: ^4.5.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6

  # Utilities
  intl: ^0.20.3
  image_picker: ^1.2.3
  permission_handler: ^11.3.1
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.17

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 800

flutter_intl:
  enabled: true
